name: myworkflow1
on:
  push:
    branches:
      - anilbranch
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep
        run: |
          whoami
          pwd
          cd
          ls -al
          cat /etc/os-release
          docker --version
          docker compose version
      - name: mystep2- clone the repo 
        uses: actions/checkout@v4
      - name: mystep3- check the source code
        run: ls -al
      - name: mystep4-build docker image
        run: docker image build -t alishakhannnnnnnnn03/myimage_nov2:t${{ github.new_number }} -f Dockerfile .
      - name: mystep5-check the docker images
        run: docker images
